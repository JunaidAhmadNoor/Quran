packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts unless listed here. Only esbuild needs one; the others
# ship prebuilt platform binaries as optional dependencies.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  '@swc/core': false
  # Linux/CUDA binary download and a version notice; the CPU runtime ships in the package.
  onnxruntime-node: false
  protobufjs: false
